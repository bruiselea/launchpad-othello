<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Launchpad Othello</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header id="header">
      <h1>Launchpad Othello</h1>
      <div id="status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">初期化中...</span>
      </div>
      <div id="ports">
        <select id="port-in" title="入力ポート"></select>
        <select id="port-out" title="出力ポート"></select>
        <button id="reconnect">再接続</button>
      </div>
    </header>

    <main id="layout">
      <section id="grid-wrap">
        <div id="grid"></div>
      </section>

      <aside id="side">
        <p id="mode-desc"></p>
        <button id="othello-reset">新規対局</button>

        <div id="log-panel" class="panel">
          <h2>ログ</h2>
          <div id="log"></div>
        </div>
      </aside>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
